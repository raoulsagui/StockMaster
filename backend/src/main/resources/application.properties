# ============================================================
# CONFIGURATION DE L'APPLICATION STOCKMASTER
# ============================================================

spring.application.name=backend

# -------------------------------------------------------
# BASE DE DONNÉES H2 (en mémoire — mode développement)
# H2 est une BDD Java légère qui tourne en mémoire.
# Avantage : pas d'installation, démarre avec l'appli.
# Inconvénient : données perdues au redémarrage.
# URL : jdbc:h2:mem:stockmaster → BDD nommée "stockmaster"
# -------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:stockmaster
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 accessible sur http://localhost:8080/h2-console
# Pratique pour inspecter les données pendant le dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------
# JPA / HIBERNATE
# ddl-auto=create-drop : Hibernate recrée le schéma à chaque
# démarrage et le supprime à l'arrêt. Pratique en dev.
# En production on utilisera "validate" ou "none".
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# -------------------------------------------------------
# SERVEUR
# Port 8080 par défaut, on le garde.
# -------------------------------------------------------
server.port=8080

# -------------------------------------------------------
# JWT — JSON Web Token
# secret : clé secrète utilisée pour signer les tokens.
#          En production, doit être dans les variables d'env.
# expiration : durée de validité du token en millisecondes
#              86400000 ms = 24 heures
# -------------------------------------------------------
jwt.secret=stockmaster-super-secret-key-must-be-at-least-256-bits-long
jwt.expiration=86400000

# -------------------------------------------------------
# CORS — Cross-Origin Resource Sharing
# Autorise le frontend Vue.js (localhost:5173) à appeler
# l'API depuis le navigateur. Sans ça, le navigateur bloque.
# -------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173

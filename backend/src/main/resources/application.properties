# ============================================================
# CONFIGURATION DE L'APPLICATION STOCKMASTER
# ============================================================

spring.application.name=stockmaster

# -------------------------------------------------------
# BASE DE DONNÉES MySQL
# -------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/stockmaster?useSSL=false&serverTimezone=Europe/Paris&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# -------------------------------------------------------
# JPA / HIBERNATE
# ddl-auto=update : Hibernate met à jour le schéma sans
# supprimer les données existantes.
# En production on utilisera "validate" ou "none".
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------
# MAIL — Mailpit (serveur de dev local)
# Mailpit intercepte les emails sans les envoyer vraiment.
# Interface web : http://localhost:8025
# Installation : https://mailpit.axllent.org
# -------------------------------------------------------
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=StockMaster <noreply@stockmaster.fr>

# -------------------------------------------------------
# SERVEUR
# Port 8080 par défaut, on le garde.
# -------------------------------------------------------
server.port=8080

# -------------------------------------------------------
# JWT — JSON Web Token
# secret : clé secrète utilisée pour signer les tokens.
#          En production, doit être dans les variables d'env.
# expiration : durée de validité du token en millisecondes
#              86400000 ms = 24 heures
# -------------------------------------------------------
jwt.secret=stockmaster-super-secret-key-must-be-at-least-256-bits-long
jwt.expiration=86400000

# -------------------------------------------------------
# CORS — Cross-Origin Resource Sharing
# Autorise le frontend Vue.js (localhost:5173) à appeler
# l'API depuis le navigateur. Sans ça, le navigateur bloque.
# -------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173
